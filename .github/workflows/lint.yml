name: Node.js build

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x, 22.x, 24.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - run: npm ci
            - run: npm run build --if-present
            - run: npm run lint
            - run: npm test
            # Reported, never enforced: the numbers are here to be looked at.
            # A threshold would fail builds on a policy nobody has decided, so
            # this deliberately has no --test-coverage-* limit. One matrix leg
            # is enough — the same suite on three Node versions covers the same
            # lines three times.
            - name: Report test coverage
              if: matrix.node-version == '24.x'
              run: npm run test:coverage
